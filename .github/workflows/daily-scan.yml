name: Täglicher Immo-Scan

on:
  schedule:
    # Sommerzeit-Näherung (CEST, UTC+2): 05:00 UTC = 07:00 deutsche Zeit
    - cron: '0 5 * 4-10 *'
    # Winterzeit-Näherung (CET, UTC+1): 06:00 UTC = 07:00 deutsche Zeit
    - cron: '0 6 * 1-3,11-12 *'
  # Manuelles Auslösen zum Testen, ohne auf den Cron zu warten
  workflow_dispatch: {}

# Schreibrechte nötig, damit der Workflow results.json zurück ins Repo committen kann
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Scan ausführen
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      - name: results.json committen (falls geändert)
        run: |
          git config user.name "immo-scan-bot"
          git config user.email "actions@github.com"
          git add data/results.json
          # Nur committen, wenn sich tatsächlich etwas geändert hat
          git diff --staged --quiet || git commit -m "Datenstand aktualisiert: $(date -u +%Y-%m-%d)"
          git push
